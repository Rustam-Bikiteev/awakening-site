    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04070f" />
    <!--
      GitHub Pages не даёт настраивать заголовки ответа, поэтому политика живёт в meta.
      'unsafe-inline' для стилей обязателен: framer-motion и recharts пишут в style-атрибут.
      connect-src нужен ровно под fetch снапшота с того же origin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://awakening-viewer.goatcounter.com; font-src 'self'; connect-src 'self' https://awakening-viewer.goatcounter.com; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>AWAKENING — журнал пробуждения</title>
    <meta
      name="description"
      content="Прокачка персонажа в реальной жизни: уровень, характеристики, ранги и серия закрытых дней. Режим наблюдателя — только чтение."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AWAKENING — журнал пробуждения" />
    <meta
      property="og:description"
      content="Реальная жизнь как игра: опыт за действия, штрафы за срывы, ранги и Врата. Наблюдение за прогрессом."
    />

    <link rel="stylesheet" crossorigin href="/awakening-site/assets/viewer-Cc9VhxkP.css">
  </head>

    ></script>

</html>
